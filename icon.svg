<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b18"/>
      <stop offset="50%" stop-color="#180e30"/>
      <stop offset="100%" stop-color="#080811"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#neon)" stroke-width="4" stroke-opacity="0.4"/>
  <!-- Glowing Nova Star / Sparkle -->
  <g transform="translate(256,256)" filter="url(#glow)">
    <path d="M 0 -160 C 15 -60, 60 -15, 160 0 C 60 15, 15 60, 0 160 C -15 60, -60 15, -160 0 C -60 -15, -15 -60, 0 -160 Z" fill="url(#neon)"/>
    <circle cx="0" cy="0" r="32" fill="#ffffff"/>
  </g>
</svg>
